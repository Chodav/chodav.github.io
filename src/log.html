<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>David Cho — Log</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="log">
  <div class="site">
    <div data-chrome></div>
    <div class="notebook">
      <div data-page-left></div>
      <main class="page page-right">
        <div data-content-meta></div>
        <h1 class="content-title">Log</h1>
        <div class="content-body">
          <p>
            My conductor from youth orchestra would always ask us when the last time we touched our instruments were. 
            It takes consistency to develop a craft. Here is a log of my progress.
          </p>
          <p>
            GitHub fills in from my contributions. Click a day on Reading to see what I logged.
          </p>

          <div class="log-toolbar">
            <button class="log-year-btn" type="button" data-year-prev aria-label="Previous year">‹</button>
            <span class="log-year-label" data-year-label>2026</span>
            <button class="log-year-btn" type="button" data-year-next aria-label="Next year">›</button>
          </div>

          <section class="log-section" data-log="github">
            <header class="log-head">
              <h2 class="log-title">GitHub</h2>
              <p class="log-stats" data-log-stats>loading…</p>
            </header>
            <div data-log-grid></div>
            <div class="log-detail" data-log-detail hidden></div>
          </section>

          <section class="log-section" data-log="reading">
            <header class="log-head">
              <h2 class="log-title">Reading</h2>
              <p class="log-stats" data-log-stats></p>
            </header>
            <div data-log-grid></div>
            <div class="log-detail" data-log-detail hidden></div>
          </section>
        </div>
      </main>
    </div>
    <div data-mount="mobile-home"></div>
  </div>
  <script src="assets/js/script.js"></script>
  <script src="assets/js/log.js"></script>
</body>
</html>
